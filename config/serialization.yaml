# Settings for the serialization targets (workflow/rules/serialization.smk, docs/SERIALIZATION.md).
# Every key can be overridden with `--config serialization_<key>=<value>`; list keys take a
# comma-separated string (`serialization_modes=default,fast`) or a list.

# Samples for the `serialization*` targets other than `serialization_smoke`. Paired-end,
# non-methylation samples only. Empty means "none chosen": those targets then fail with a hint.
samples: []
modes: [default, fast]
endpoints: [pinned, unpinned, practical]
tools: [bwa-mem3, bwa, bwa-mem2, minibwa]
indexes: [stock, dense]
# The same list for fidelity and timing, so their results pair up.
archs: [m8a, m8g]  # each must be in arena.archs
# CPUs the pinned and practical endpoints are confined to (`taskset -c 0-<budget-1>`).
budget: 8
# BAM compression threads (`--bam-threads` / `samtools view -@`) at pinned and unpinned.
helpers: 2
# Measured rounds per timing job, after one warmup round.
reps: 5
# `-K`, for bwa-mem3, bwa and upstream bwa-mem2. null means `batch_bases` (config/defaults.yaml).
batch_k: null
# `-t` for the fidelity alignments; at most `arena.threads`.
fidelity_threads: 16
# The bwa-mem3 binary under test, as installed in the image.
aligner: bwa-mem2.fg-labs
