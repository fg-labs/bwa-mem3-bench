# `baseline_arch` selects the fg-labs/bwa-mem3 `BASELINE_ARCH` build-arg used
# to compile the non-kernel TUs of the single binary on x86 (added by fg-labs
# PR #84). The plumbing is wired end-to-end (`Arch.image_uri` →
# `resources.container_image` → snakemake-executor-plugin-aws-batch fork),
# but every arch is currently set to `""` (use the portable `:<sha>` tag).
#
# Why parked: empirical data on this workload (3-rep medians on c7a / c7i /
# m7i, hg38 + 5M-pair samples, fg-labs/bwa-mem3 `316dba62`) shows
# `BASELINE_ARCH=avx512bw` is consistently slower than the AVX2 default on
# Zen 4 (c7a +12-17%) and only mixed/wash on Sapphire Rapids (c7i / m7i).
# PR #84's claimed +10-15% gain doesn't materialize. See the fg-labs/bwa-mem3
# AVX-512 baseline-build Phase C benchmarking for the full numbers and likely
# root causes.
#
# Re-enable per-arch when upstream lands a fix (most likely
# `-mprefer-vector-width=256` or pragma'd hot loops): set the relevant
# archs to `avx512bw` here, build the image variant via
# `cli build --baseline-arch avx512bw --push`, re-run.
archs:
  c7g:
    instance_type: c7g.4xlarge
    batch_queue: bwa-mem3-bench-c7g
    simd: neon
    platform: linux/arm64
    baseline_arch: ""
  c6a:
    instance_type: c6a.4xlarge
    batch_queue: bwa-mem3-bench-c6a
    simd: avx2
    platform: linux/amd64
    # AVX2 is the upstream default in fg-labs/bwa-mem3 main, so the portable
    # `<sha>` tag (built by `cli build` with no --baseline-arch) already
    # ships an AVX2-baselined binary. Empty here so c6a workers pull the
    # bare portable tag instead of a hypothetical `<sha>-avx2` we don't
    # actually publish.
    baseline_arch: ""
  c7i:
    instance_type: c7i.4xlarge
    batch_queue: bwa-mem3-bench-c7i
    simd: avx512
    platform: linux/amd64
    baseline_arch: ""
  c8g:
    instance_type: c8g.4xlarge
    batch_queue: bwa-mem3-bench-c8g
    simd: neon
    platform: linux/arm64
    baseline_arch: ""
  c7a:
    instance_type: c7a.4xlarge
    batch_queue: bwa-mem3-bench-c7a
    simd: avx512
    platform: linux/amd64
    baseline_arch: ""
  # m7i: Sapphire Rapids general-purpose (64 GB, 4 GB/vCPU). Same CPU family /
  # AVX-512BW as c7i (32 GB host is too small for meth FMI). Meth samples run
  # here; non-meth samples also run here so meth-vs-non-meth is apples-to-apples
  # on identical hardware, and m7i vs c7i isolates meth-mem-overhead from raw
  # CPU. Chosen over r7i (128 GB memory-optimized) because the extra RAM was
  # unused and r7i's sustained-perf variance was ~5x higher under spot.
  m7i:
    instance_type: m7i.4xlarge
    batch_queue: bwa-mem3-bench-m7i
    simd: avx512
    platform: linux/amd64
    baseline_arch: ""

core_arch: c8g
full_archs: [c8g, c7g, c6a, c7i, c7a, m7i]
