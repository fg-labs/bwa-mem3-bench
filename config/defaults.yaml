region: us-east-1
# S3 bucket holding references, fastq inputs, and run/baseline outputs. Override
# per deployment via cdk/outputs.json (populated by `cdk deploy`) or the
# BWA_MEM3_BENCH_S3_BUCKET env var; aws_config.load() prefers those over this
# default. The default name will fail to resolve in S3 (names are global) — pick
# your own bucket name.
bucket: bwa-mem3-bench
ecr_repo: bwa-mem3-bench
upstream_tag: v2.2.1
bwameth_version: "0.2.7"
bwa_version: "0.7.19"

threads: 16
reps_default: 1
reps_baseline: 5

# Batch size in bases, passed as `-K` to BOTH bwa-mem3 and upstream bwa-mem2 on
# every alignment the concordance comparisons read.
#
# Why pin it at all. bwa (fastmap.c:394), bwa-mem2 v2.2.1 and bwa-mem3 all compute
# the default batch as `chunk_size * n_threads`, and mem_pestat() infers the
# paired-end insert-size distribution from whatever reads land in a batch -- those
# percentile bounds then feed pairing, mate rescue and MAPQ. So the DEFAULT output
# is a function of `-t`. Measured on wgs-5M: upstream bwa-mem2 disagrees with
# ITSELF on 290 of 10,030,558 records between -t 16 and -t 32 (insert-size mean
# 401.00+/-308.50 vs 285.27+/-163.76). `-K` is upstream's own answer -- bwa's help
# text reads "process INT input bases in each batch regardless of nThreads (for
# reproducibility)". With it pinned equally on both sides, output is thread-
# invariant (verified: 0 diffs, t=16 vs t=32, both aligners) and the blessed golden
# stops depending on the value of `threads:` above.
#
# Why THIS value. 160,000,000 == the historical default: chunk_size (10,000,000,
# `bwamem.c:99` / `bwamem.cpp:382` in both tools) x 16 threads. So pinning it is
# output-NEUTRAL against every BAM produced before it existed (verified: 0 diffs
# vs the un-pinned invocation at -t 16). It is deliberately a LITERAL and not
# `chunk_size * threads`: deriving it from `threads` would re-couple the golden to
# the very knob this decouples it from. Changing this number changes every
# alignment's output and requires a re-bless.
#
# NOT applied to: the thread-scaling ladder (rules/scaling.smk -- it exists to
# measure the batch-size/thread interaction, and pinning the batch would distort
# Gate #3), bwameth (no such flag; it wraps bwa-mem2 itself), or minibwa (its `-K`
# sets a mini-batch with different semantics, its batching is already
# thread-invariant at fixed 100M/1G defaults, and it is a wall-time comparator
# that should run at its author's defaults).
batch_bases: 160000000

# Wall-clock budget for each of the two tachyon host-contention probes that
# bracket every regular sweep cell (`align_fg_labs`) -- one pre, one post,
# same pre/post-agreement reasoning as `thread_scaling.host_probe_seconds`
# below, but sized far shorter: a sweep cell's own wall time ranges from
# smoke-1M's ~2 s to a real dataset's ~130 s, so the ladder's 10 s-per-side
# default would be a 10x overhead on the cheapest cells rather than a rounding
# error. See fg-labs/bwa-mem3-bench#56.
sweep_host_probe_seconds: 2.0

# Thread-scaling ladder (`--target thread_scaling`, part of `bless_release`).
#
# Strong-scaling efficiency E(n) = T(1) / (n * T(n)) is only meaningful on FIXED
# hardware, so the entire ladder runs as ONE Batch job on ONE host: every point
# shares a machine, which removes host-to-host variance (the dominant noise
# source here) and acquires one spot instance instead of seven.
#
# `arch` is c8g64 (c8g.16xlarge) because Graviton4 has no SMT — 64 vCPU is 64
# physical cores, so the curve has no hyperthreading knee. A 64-vCPU x86 host is
# 32 physical + SMT and would bend at 32 for reasons unrelated to the aligner.
#
# Every rung carries the SAME rep count, and T(1) is the reason.
#
# This used to be uneven — t=1 and t=2 at reps:1, t=4/t=8 at 2 — on the argument
# that a 1-thread run is ~16x the wall of a 16-thread one and "the high thread
# counts are what the gate actually reads". That argument is backwards.
# E(n) = T(1) / (n * T(n)) divides by T(1) at EVERY rung, so T(1) is the one
# measurement the gate reads seven times, and an unreplicated T(1) puts its full
# noise into all seven efficiencies at once. It was the only value in the ladder
# with no defence against a single bad host.
#
# Measured, one unreplicated T(1) per release: 1506.8 s (394f8f8), 1342.3 s
# (v0.8.0), 1244.7 s (v0.9.0) — a monotonic 17% decline across two releases
# whose diffs contain no SIMD, FMI or Makefile change. The 5-rep sweep over the
# same period is flat, so the ladder is not seeing a real speedup; it is seeing
# host variance land on the term everything else is divided by. That drift also
# ratchets the gate: each release's T(1) becomes the next release's bar.
#
# Cost of levelling up: ~62 min added per bless (2 extra t=1 at ~21 min, 2 extra
# t=2 at ~10 min). The whole ladder is one Batch job on one host, so this buys a
# median at every rung for one instance-hour, and it is cheap next to re-running
# a bless that a phantom Gate #3 failure blocked.
thread_scaling:
  sample: wgs-5M
  arch: c8g64
  ladder:
    - {threads: 1, reps: 3}
    - {threads: 2, reps: 3}
    - {threads: 4, reps: 3}
    - {threads: 8, reps: 3}
    - {threads: 16, reps: 3}
    - {threads: 32, reps: 3}
    - {threads: 64, reps: 3}
  # Gate tolerance, in percentage points of efficiency, against the PREVIOUS
  # RELEASE's measured ladder — not against invented absolute targets. Absolute
  # thresholds would be guesses until we have a first measurement; a
  # release-over-release comparison is both calibrated and consistent with how
  # Gate #2 (vs-golden) already works. A point may lose at most this much
  # efficiency before `bench regression` fails the bless.
  max_efficiency_drop_pp: 3.0
  # Seconds per tachyon host-contention probe. Two run per ladder, one either
  # side, so this is ~0.7% overhead on a ~45-minute job — the reading is never
  # worth skipping to save it. It exists because a ladder's T(1) anchor is exactly
  # the measurement host quality corrupts, and until now nothing recorded what the
  # host was doing: the 17% T(1) drift across v0.7.0/v0.8.0/v0.9.0 took a same-day
  # control run to attribute, because there was no probe reading to look at.
  # Annotate and FILTER on the score; never divide a wall time by it (the probe is
  # not purely a memory probe). See fg-labs/bwa-mem3-bench#56.
  host_probe_seconds: 10.0

# "Arena" release-history comparison (`--target arena`,
# workflow/rules/arena.smk): every blessed bwa-mem3 release plus lh3/bwa,
# upstream bwa-mem2, and minibwa, interleaved on ONE fixed on-demand host per
# arch. Scoped deliberately narrow (one sample, two archs) -- it is a
# correctness-anchored progression view alongside the cross-arch sweep, not a
# replacement for it, and runs on ON-DEMAND instances (see cdk/stacks/
# batch_stack.py's ArenaCe) rather than spot, so it is priced to stay narrow.
#
# The arm list itself (which releases, bwa/bwa-mem2/minibwa) is NOT here -- it
# is the fixed set the builder base image bakes in (docker/Dockerfile.base),
# hardcoded in arena.smk. Only the measurement scope lives here.
arena:
  sample: wgs-5M
  # c8a, not c7i: c7i.4xlarge is 16 vCPU over 8 physical cores (2-way SMT),
  # while c8a and c8g are both no-SMT (16 vCPU = 16 real cores) -- see
  # workflow/rules/arena.smk's module docstring.
  archs: [c8a, c8g]
  reps: 3
  threads: 16
  # Same rationale as thread_scaling.host_probe_seconds -- at ~13-14 arms x
  # 4 cycles (1 warmup + 3 reps), the arena runs well over an hour per arch
  # (see align_arena's own `resources.runtime = 14400` budget), so two 10s
  # probes are still a small fraction of it.
  host_probe_seconds: 10.0

references:
  hg38:
    key: references/hg38/
    fasta_name: Homo_sapiens_assembly38.fasta
  hg38-meth:
    key: references/hg38-meth/
    fasta_name: Homo_sapiens_assembly38.fasta

runs_prefix: runs/
baseline_prefix: baseline/
golden_prefix: golden/
data_prefix: data/
