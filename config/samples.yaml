# `source` is a bucket-relative key prefix. The workflow joins it with the
# configured S3 bucket (defaults.yaml `bucket` or BWA_MEM3_BENCH_S3_BUCKET) at
# run time, so the same samples.yaml works against any bucket.

# Aux tags excluded from `compare-bams`, per comparison KIND. Every tag NOT
# listed is compared strictly and a difference counts against concordance;
# excluded tags are still tallied in the report's `by_tag` block (flagged
# `ignored: true`), so a wrong entry here is diagnosable rather than silent.
#
# The list is a property of the comparison, not of the sample: `vs_baseline`
# compares against a DIFFERENT aligner (upstream bwa-mem2, or bwameth for meth
# samples), while vs_golden / vs_x86 compare bwa-mem3 against itself at the same
# search settings -- so every tag is comparable there and nothing is skipped.
# vs_default is the exception: same binary, but `--fast` prunes the candidate set
# by design, so the tags describing that set are skipped (see its block below).
#
# Per-sample `compare_options.<kind>.ignore_tags` EXTENDS these defaults. The
# bisulfite lists are NOT declared per sample -- both halves are derived from
# `is_meth` (METH_IGNORE_TAGS / METH_EXTRA_TAGS in workflow_config.py), so they
# cannot drift apart or go missing on a sample nobody remembered to annotate.
#
# `expect_tags` is the companion allowlist: the tags that MAY appear. Any tag
# compare-bams observes that is on neither list fails the run BY NAME, so a tag
# nobody anticipated is not just an unexplained drop in concordance. Semantics
# are "may", not "must" -- a listed tag that never appears is a harmless no-op,
# which is what lets one per-kind list cover samples whose tag sets legitimately
# differ (single-end reads carry no mate tags).
#
# The anchored value below is the measured union over 46 (kind x sample x arch)
# census cells covering wgs / wes / panel-twist / smoke / hic / sbx / meth. All
# four kinds share it because the emitted vocabulary is a property of the
# ALIGNER PAIR, not of the comparison: three of the four kinds are
# bwa-mem3-vs-bwa-mem3 by construction, so their vocabulary is identical by
# definition rather than by coincidence. The anchor makes that structural while
# keeping each kind's declaration literally non-empty --
# `_validate_compare_defaults` rejects an empty one, because compare-bams skips
# the check when handed no allowlist and the guard would go silently inert.
compare_defaults:
  # bwa-mem3 emits MQ on every record and HN on every mapped one; upstream
  # bwa-mem2 emits neither, so comparing either scores 0% concordance.
  vs_baseline:
    ignore_tags: ["MQ", "HN"]
    expect_tags: &core_expect_tags ["AS", "HN", "MC", "MD", "MQ", "NM", "SA", "XA", "XS"]
  # bwa-mem3 vs bwa-mem3 at the same search settings: same binary, same
  # candidate set, so every tag is comparable and any difference is a real
  # finding. Measured cost of full strictness: 0.0000pp on vs_x86, <=0.094pp
  # on vs_golden.
  vs_golden:
    ignore_tags: []
    expect_tags: *core_expect_tags
  vs_x86:
    ignore_tags: []
    expect_tags: *core_expect_tags
  # bwa-mem3 `--compat=bwa-mem` vs lh3/bwa. Strict on every tag, and unlike
  # vs_baseline it needs no exclusions to get there: the bwa-mem target keeps
  # MQ:i (bwa emits it, from 0.7.18) and drops HN:i (bwa has no counterpart),
  # so both sides carry exactly the same tag set. An exclusion here would hide
  # the regression the arm exists to catch.
  vs_bwa:
    ignore_tags: []
    expect_tags: *core_expect_tags
  # `--fast` vs default is the ONE same-binary comparison that is not
  # same-behaviour: the preset prunes the candidate set on purpose
  # (`--smem-dedup`, the score-gated chain-extension cap), and `--extend-csub`
  # repairs MAPQ. So the tags DESCRIBING that candidate set diverge by design —
  # XS 18.8%, XA 17.2%, SA 39.8%, HN 7.1% of reads on wgs-5M — carrying no
  # placement information. MQ follows because a repaired mate MAPQ moves MQ on
  # this read mechanically.
  #
  # Excluding them is not cosmetic. This comparison's stated purpose
  # (workflow/Snakefile `rule fast`, fg-labs/bwa-mem3#189) is a MAPQ-stratified
  # answer to "which reads moved, and were they low-confidence?" — comparing the
  # pruned candidate set buries that signal. Measured: full strictness costs up
  # to +21.8pp and swamps by_class; this leaves +0.42pp worst case.
  #
  # Tags describing the CHOSEN alignment stay strict (AS, MD, NM, MC), all
  # under 1% divergent.
  vs_default:
    ignore_tags: ["XS", "HN", "XA", "SA", "MQ"]
    expect_tags: *core_expect_tags

samples:
  wgs-5M:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/wgs/1kg-HG00096/downsampled-5M/
    fg_labs_flags: []

  wes-5M:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/wes/1kg-HG00100/downsampled-5M/
    fg_labs_flags: []

  panel-twist-5M:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/panel/twist-umi/downsampled-5M/
    fg_labs_flags: []

  meth-twist-emseq-5M:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/meth/twist-emseq/downsampled-5M/
    fg_labs_flags: ["--meth"]

  smoke-1M:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/smoke/1M/
    fg_labs_flags: []

  # Tiny bisulfite smoke — ~10K pairs. Exercises the full meth pipeline
  # (hg38-meth reference, bwameth.py baseline, fg-labs --meth, meth queue)
  # without paying for a 5M-pair alignment. Use via `--target smoke_meth`.
  smoke-meth:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/smoke-meth/10K/
    fg_labs_flags: ["--meth"]

  # 1M Hi-C read pairs (HG002, 2x151 PE). Chimeric / long-range-mate structure
  # produces heavy supplementary alignments — exercises the supplementary
  # disagreement metrics in compare-bams. Source: Zenodo 10.5281/zenodo.19703025
  # (CC BY 4.0, Heng Li). See docs/data-setup.md.
  hic-1M:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/hic/hg002-1M/
    layout: paired
    fg_labs_flags: []
    # Canonical Hi-C alignment (Arima/Juicer/Omni-C use `bwa mem -SP5`):
    #   -S skip mate rescue, -P skip pairing, -5 take the smallest-coordinate
    #   split as primary. Hi-C reads are chimeric ligation products, so the
    #   normal insert-distribution-based mate rescue is biologically wrong AND
    #   is what produced the ~17 kb mate-SW reference windows that OOM-killed
    #   the aligner inside the 28 GB cgroup on ARM workers. -SP removes that
    #   path entirely (peak RSS ~21 GB; eliminates the ballooning failure mode
    #   rather than just shrinking it). Applied to both fg-labs and the upstream
    #   baseline (mem_flags) since -5SP is NOT concordance-neutral vs plain mem,
    #   so both sides must use it to keep vs-baseline / vs-x86 apples-to-apples.
    mem_flags: ["-5", "-S", "-P"]

  # ~1M Roche SBX reads (HG002, single-end, 50-974 bp, median ~224). Novel
  # mid-length single-end read class; staged by subsampling a coordinate-sorted
  # SBX BAM to FASTQ. Source: Roche Axelios "xoos" GIAB webinar BAMs
  # (CC BY-NC 4.0 — NON-COMMERCIAL). See docs/data-setup.md.
  sbx-1M:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sbx/hg002-1M/
    layout: single
    fg_labs_flags: []

  # ---------------------------------------------------------------------------
  # Truth-based accuracy samples (holodeck-simulated). `truth: true` marks the
  # `source` prefix as also holding the truth artifacts (`golden.bam`,
  # `truth.vcf`, and `cpg-truth.bedGraph` for meth) the `eval_accuracy` rule
  # grades against. Generated by `scripts/gen_holodeck_dataset.sh` and staged to
  # S3 (never committed). Reference is always full hg38 — depth is bounded by a
  # target BED in the `-vars` datasets, never by reducing the reference.
  #
  # The `--meth-scoring genomic` D3 arm is a FIRST-CLASS arm, expressed as a
  # SEPARATE sample that shares its `source` (FASTQs + truth) with its collapsed
  # sibling — the align rules key flags off the sample name, so two D3 flag sets
  # over one dataset means two samples. `*-genomic` samples are fg-labs-arm-only
  # (no baseline/minibwa eval requested for them); their `baseline_tool` is set
  # for schema validity but never invoked.
  #
  # Driven by `--target accuracy` (full) / `accuracy_smoke` (chr22-slice). NOT
  # part of `rule all` / `baseline_all` — they have no upstream-concordance
  # question. See workflow/rules/eval.smk.
  # ---------------------------------------------------------------------------

  # Non-meth: bwa-mem3 vs minibwa vs upstream bwa-mem2, graded on placement +
  # MAPQ calibration (sim-wgs-place) and per-read variant representation
  # (sim-wgs-vars, depth over a target BED).
  sim-wgs-place:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sim/sim-wgs-place/
    fg_labs_flags: []
    truth: true

  sim-wgs-vars:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sim/sim-wgs-vars/
    fg_labs_flags: []
    truth: true

  # Meth: D3 collapsed vs D3 genomic vs bwameth, graded on placement + MAPQ +
  # methylation-level correlation (sim-meth-place) and the variant-recovery
  # headline (sim-meth-vars). The collapsed arm is the default `["--meth"]`;
  # the genomic arm is its `*-genomic` sibling sharing this `source`.
  sim-meth-place:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/sim/sim-meth-place/
    fg_labs_flags: ["--meth"]
    truth: true

  sim-meth-place-genomic:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/sim/sim-meth-place/
    fg_labs_flags: ["--meth", "--meth-scoring", "genomic"]
    truth: true

  sim-meth-vars:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/sim/sim-meth-vars/
    fg_labs_flags: ["--meth"]
    truth: true

  sim-meth-vars-genomic:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/sim/sim-meth-vars/
    fg_labs_flags: ["--meth", "--meth-scoring", "genomic"]
    truth: true

  # chr22-slice smoke versions (fast/cheap wiring validation for the harness),
  # distinct from the full-hg38 decisive datasets above. One non-meth + one meth
  # dataset (with its genomic sibling) covers all arms + all three eval axes.
  sim-smoke-vars:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sim/sim-smoke-vars/
    fg_labs_flags: []
    truth: true

  sim-smoke-meth-vars:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/sim/sim-smoke-meth-vars/
    fg_labs_flags: ["--meth"]
    truth: true

  sim-smoke-meth-vars-genomic:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/sim/sim-smoke-meth-vars/
    fg_labs_flags: ["--meth", "--meth-scoring", "genomic"]
    truth: true

  # ---------------------------------------------------------------------------
  # `--fast` preset siblings (fg-labs/bwa-mem3 PR #189). Each `<base>-fast`
  # sample SHARES its base sample's `source` (identical FASTQs + truth) and
  # differs only by adding `--fast` to `fg_labs_flags`, so default-vs-fast
  # isolates the preset on a byte-identical binary at one fg-labs SHA — exactly
  # the `*-genomic` meth-scoring sibling pattern (the align rules key flags off
  # the sample name, so a second flag set over one dataset is a second sample).
  #
  # `--fast` ≡ `-m 10 -y 0 --min-ext-len 30 --smem-dedup` (+ `-s 0` under
  # `--meth`); PR #189 reports ~1.86x wall / -51% CPU on WGS with divergence
  # confined to low-MAPQ reads. These siblings are NOT in `rule all` /
  # `baseline_all` / `accuracy` — they are driven only by the opt-in `fast`
  # target (workflow/Snakefile), which adds the fast-vs-default concordance
  # (`compare/vs-default.json`) the standard sweep does not produce.
  #
  # Real-data arms (wall + peak RSS + concordance via compare-bams):
  # ---------------------------------------------------------------------------
  wgs-5M-fast:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/wgs/1kg-HG00096/downsampled-5M/
    fg_labs_flags: ["--fast"]

  wes-5M-fast:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/wes/1kg-HG00100/downsampled-5M/
    fg_labs_flags: ["--fast"]

  meth-twist-emseq-5M-fast:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/meth/twist-emseq/downsampled-5M/
    fg_labs_flags: ["--meth", "--fast"]

  # Remaining real datasets, so `--fast` is compared on every dataset the
  # benchmark carries. Each mirrors its base sample's layout / mem_flags so the
  # fast-vs-default comparison stays apples-to-apples.
  panel-twist-5M-fast:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/panel/twist-umi/downsampled-5M/
    fg_labs_flags: ["--fast"]

  hic-1M-fast:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/hic/hg002-1M/
    layout: paired
    fg_labs_flags: ["--fast"]
    # Same canonical Hi-C mem flags as the base (applied to both arms).
    mem_flags: ["-5", "-S", "-P"]

  sbx-1M-fast:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sbx/hg002-1M/
    layout: single
    fg_labs_flags: ["--fast"]

  # ---------------------------------------------------------------------------
  # `--compat=bwa-mem2` siblings (fg-labs/bwa-mem3#277).
  #
  # The default sweep's `vs_baseline` already scores 100% against upstream, but
  # only with `ignore_tags: [MQ, HN]` -- bwa-mem3 emits both and bwa-mem2 emits
  # neither, so comparing them would score 0%. That makes the standing claim
  # "100% concordant modulo two tags we had to exclude", not "byte-identical".
  #
  # `--compat=bwa-mem2` suppresses exactly those two tags plus the default @HD
  # and the .hdr/.dict sidecar, so the exclusion list can go to EMPTY and the
  # comparison becomes a true byte-identity assertion. `ignore_tags` is dropped
  # for these samples by `WorkflowConfig.ignore_tags()`, derived from
  # `is_compat` -- not declared here, so it cannot drift across siblings.
  #
  # Cross-arch coverage is the point. Byte-identity was only ever verified on
  # AVX2, while the known phantom-XS defect in the 8-bit kswv mate-rescue
  # kernels (fg-labs/bwa-mem3#290) is specific to NEON and AVX-512BW -- c8g,
  # c7g, c7a and c7i, four of the six benched arches. These arms run on every
  # arch, comparing against the x86 baseline (bwa-mem2 has no ARM build), which
  # is what turns that defect from an assumed ~1-in-8M into a measured number.
  #
  # `--compat` is mutually exclusive with both `--fast` and `--meth` upstream,
  # so there are no meth or fast siblings here; `Sample.__post_init__` rejects
  # either combination at config load.
  # ---------------------------------------------------------------------------
  wgs-5M-compat:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/wgs/1kg-HG00096/downsampled-5M/
    fg_labs_flags: ["--compat=bwa-mem2"]

  wes-5M-compat:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/wes/1kg-HG00100/downsampled-5M/
    fg_labs_flags: ["--compat=bwa-mem2"]

  panel-twist-5M-compat:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/panel/twist-umi/downsampled-5M/
    fg_labs_flags: ["--compat=bwa-mem2"]

  hic-1M-compat:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/hic/hg002-1M/
    layout: paired
    fg_labs_flags: ["--compat=bwa-mem2"]
    # Same canonical Hi-C mem flags as the base (applied to both arms).
    mem_flags: ["-5", "-S", "-P"]

  sbx-1M-compat:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sbx/hg002-1M/
    layout: single
    fg_labs_flags: ["--compat=bwa-mem2"]

  # Simulated (holodeck) compat arms. These were the only non-meth datasets with
  # no compat sibling, and they carry a different error profile from the real
  # 1000 Genomes / Twist data — worth having on a claim this strong. Their bases
  # are `truth: true`, but the siblings are NOT: they are scored by compare-bams
  # and fgumi against the upstream baseline, not graded against simulation truth,
  # and `truth: true` would route them into the accuracy machinery instead.
  # The bases' baselines already exist (the accuracy target produces them), so a
  # sibling costs only its own alignment.
  sim-wgs-place-compat:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sim/sim-wgs-place/
    fg_labs_flags: ["--compat=bwa-mem2"]

  sim-wgs-vars-compat:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sim/sim-wgs-vars/
    fg_labs_flags: ["--compat=bwa-mem2"]

  # Wiring check for the compat pipeline, driven by `--target compat_smoke`.
  smoke-1M-compat:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/smoke/1M/
    fg_labs_flags: ["--compat=bwa-mem2"]

  # ---------------------------------------------------------------------------
  # `--compat=bwa-mem` siblings (fg-labs/bwa-mem3 0.9.0).
  #
  # The second compat target. It is NOT a variant spelling of the first: bwa
  # gained the default `@HD` (0.7.18) and `MQ:i` (lh3/bwa#330) after bwa-mem2
  # forked at 0.7.17, so `--compat=bwa-mem` KEEPS both where `--compat=bwa-mem2`
  # suppresses them. Only `HN:i` and the .hdr/.dict sidecar are genuinely
  # bwa-mem3-only, and both targets drop those.
  #
  # Scored against the `bwa/` arm (rules/align_bwa.smk), not the bwa-mem2
  # baseline -- against bwa-mem2 this arm's retained `MQ:i` would read as
  # discordance. `vs_bwa` carries an EMPTY ignore list, same as the bwa-mem2
  # arms: both sides emit the same tag set, so no exclusion is needed to reach
  # byte-identity and adding one would hide the regression the arm exists for.
  #
  # The `-compat-bwa-mem` suffix is load-bearing: `_validate_compat_siblings`
  # strips it to find the base sample AND asserts it matches the `--compat=`
  # target, so a sibling cannot be graded against the wrong upstream.
  #
  # smoke-1M is driven by `--target compat_bwa_smoke`; the seven datasets below
  # it by `--target compat_bwa`, which mirrors `COMPAT_REAL_SAMPLES` so the two
  # compat arms cover the same bases (pinned by a test -- a bwa-only or
  # mem2-only base would claim parity on a wider set than was measured).
  #
  # Still out of `rule all` and `bless_release`: bwa needs its own index family
  # and is materially slower than bwa-mem2, and the arm has no track record yet.
  # Its cache is keyed on `bwa_version`, so the first sweep pays for every cell
  # and later ones are free.
  # ---------------------------------------------------------------------------
  smoke-1M-compat-bwa-mem:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/smoke/1M/
    fg_labs_flags: ["--compat=bwa-mem"]

  # ---------------------------------------------------------------------------
  # ALT-aware arms (`alt_aware: true`).
  #
  # Everything else in this file runs with ALT-awareness OFF: the hg38 index has
  # 261 `_alt` + 525 HLA + 2,385 `_decoy` contigs, but no `.alt` sidecar was
  # staged, so `bns->anns[].is_alt` was never set and the entire ALT-aware code
  # path -- ALT primary selection, the ALT MAPQ adjustment, the `pa:f:` tag, the
  # `-h INT,INT` alt hit cap -- never executed. Proven, not assumed: the compat
  # arms run with a strict `expect_tags` allowlist that has no `pa` entry, and
  # compare-bams fails by name on an unexpected tag; zero `pa:f:` were ever seen.
  #
  # These arms close that gap. Staging the sidecar marks 3,171 of 3,366 contigs
  # ALT, so this is not a marginal toggle -- it is a different alignment problem,
  # and the one two upstream divergence reports (bwa-mem2#227, #61) are about.
  #
  # A separate base sample is required, not just siblings: `alt_aware` changes
  # the alignment, so the compat arms need a baseline computed WITH it. Reusing
  # `wgs-5M`'s alt-naive baseline would score a real behavioural difference as a
  # compat failure. `_validate_compat_siblings` enforces the agreement.
  # ---------------------------------------------------------------------------
  wgs-5M-alt:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/wgs/1kg-HG00096/downsampled-5M/
    alt_aware: true
    fg_labs_flags: []

  wgs-5M-alt-compat:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/wgs/1kg-HG00096/downsampled-5M/
    alt_aware: true
    fg_labs_flags: ["--compat=bwa-mem2"]

  wgs-5M-alt-compat-bwa-mem:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/wgs/1kg-HG00096/downsampled-5M/
    alt_aware: true
    fg_labs_flags: ["--compat=bwa-mem"]

  wgs-5M-compat-bwa-mem:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/wgs/1kg-HG00096/downsampled-5M/
    fg_labs_flags: ["--compat=bwa-mem"]

  wes-5M-compat-bwa-mem:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/wes/1kg-HG00100/downsampled-5M/
    fg_labs_flags: ["--compat=bwa-mem"]

  panel-twist-5M-compat-bwa-mem:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/panel/twist-umi/downsampled-5M/
    fg_labs_flags: ["--compat=bwa-mem"]

  hic-1M-compat-bwa-mem:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/hic/hg002-1M/
    layout: paired
    fg_labs_flags: ["--compat=bwa-mem"]
    # Same canonical Hi-C mem flags as the base, applied to bwa too.
    mem_flags: ["-5", "-S", "-P"]

  sbx-1M-compat-bwa-mem:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sbx/hg002-1M/
    layout: single
    fg_labs_flags: ["--compat=bwa-mem"]

  sim-wgs-place-compat-bwa-mem:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sim/sim-wgs-place/
    fg_labs_flags: ["--compat=bwa-mem"]

  sim-wgs-vars-compat-bwa-mem:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sim/sim-wgs-vars/
    fg_labs_flags: ["--compat=bwa-mem"]

  # ---------------------------------------------------------------------------
  # Truth-based accuracy arms (holodeck-graded placement + MAPQ calibration +
  # variant representation, and methylation correlation for meth). These verify
  # PR #189's "no high-confidence accuracy loss" claim against known truth.
  # ---------------------------------------------------------------------------
  sim-wgs-place-fast:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sim/sim-wgs-place/
    fg_labs_flags: ["--fast"]
    truth: true

  sim-wgs-vars-fast:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sim/sim-wgs-vars/
    fg_labs_flags: ["--fast"]
    truth: true

  sim-meth-place-fast:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/sim/sim-meth-place/
    fg_labs_flags: ["--meth", "--fast"]
    truth: true

  sim-meth-vars-fast:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/sim/sim-meth-vars/
    fg_labs_flags: ["--meth", "--fast"]
    truth: true

  # `--fast` smoke siblings — cheap end-to-end wiring validation for the fast
  # pipeline (align + compare_vs_default + accuracy fast arm) before the full
  # `fast` run. Driven by `--target fast_smoke`.
  smoke-1M-fast:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/smoke/1M/
    fg_labs_flags: ["--fast"]

  smoke-meth-fast:
    baseline_tool: bwameth
    reference: hg38-meth
    source: data/smoke-meth/10K/
    fg_labs_flags: ["--meth", "--fast"]

  sim-smoke-vars-fast:
    baseline_tool: bwa-mem2-upstream
    reference: hg38
    source: data/sim/sim-smoke-vars/
    fg_labs_flags: ["--fast"]
    truth: true
