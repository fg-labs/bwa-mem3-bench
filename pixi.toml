[workspace]
authors = ["Nils Homer"]
channels = ["conda-forge", "bioconda"]
name = "bwa-mem3-bench"
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[dependencies]
python = ">=3.12,<3.13"
samtools = ">=1.22.1,<2"
# Rust toolchain pinned via rust-toolchain.toml; rustup is installed here for dev parity.
# NOTE: `>=1.85` is the workspace's own floor, but `install-fgumi` needs >= 1.93
# (fgumi's `rust-version`), which it checks at run time rather than raising this
# bound — the bound governs what builds `compare-bams`, and pinning it to fgumi's
# requirement would couple this repo's toolchain to a third-party dependency.
rust = ">=1.85"
pytest = ">=7.0"
pytest-cov = ">=4.0"
ruff = ">=0.1"
mypy = ">=1.0"
types-pyyaml = ">=6.0.12.20260408,<7"

[feature.workflow.dependencies]
snakemake-minimal = ">=8.27.1,<9"
psutil = ">=5.9"
mawk = ">=1.3.4"

[feature.workflow.pypi-dependencies]
snakemake-executor-plugin-aws-batch = { git = "https://github.com/nh13/snakemake-executor-plugin-aws-batch.git", rev = "71cbeeae37f8d6ed5e5cec832beece84345b9382" }
snakemake-storage-plugin-s3 = ">=0.2"

[feature.analysis.dependencies]
pandas = ">=2.0"
plotly = ">=6.1.1,<7"
python-kaleido = ">=1.0.0,<2"
pyyaml = ">=6.0"
pysam = ">=0.22"

[feature.dev.dependencies]
pre-commit = ">=3.0"

[feature.cdk.dependencies]
# jsii (transitive dep of aws-cdk-lib) requires attrs<26; override conda's 26.x default
attrs = ">=21.2,<26"

[feature.cdk.pypi-dependencies]
aws-cdk-lib = ">=2.175.0,<3"
constructs = ">=10.0,<11"

[pypi-dependencies]
bwa_mem3_bench = { path = ".", editable = true }
boto3 = ">=1.35"
rich = ">=13"

[environments]
default = { features = ["workflow", "analysis", "cdk"] }
dev = { features = ["workflow", "analysis", "dev", "cdk"] }

[tasks]
# Rust
cargo-fmt        = "cargo fmt --all"
cargo-fmt-check  = "cargo fmt --all -- --check"
cargo-clippy     = "cargo clippy --all-features --all-targets -- -D warnings"
cargo-test       = "cargo test --workspace"
cargo-build      = "cargo build --workspace --release"

# Python
py-fmt-check = "ruff format --check bwa_mem3_bench tests"
py-fmt       = "ruff format bwa_mem3_bench tests"
py-lint      = "ruff check bwa_mem3_bench tests"
py-type      = "mypy --strict bwa_mem3_bench"
py-test      = "pytest -v"

# fgumi, for `tests/test_fgumi_non_primary.py`. Not a conda/pypi dependency:
# `compare` is feature-gated off in a default build, so it has to come from the
# same pinned git ref the runtime image uses. The script sources that pin rather
# than repeating it, so the dev binary and the image binary cannot drift.
#
# Must run through pixi: fgumi needs rustc >= 1.93 and this environment's conda
# `rust` is 1.94, where a bare shell gets rustup honouring rust-toolchain.toml's
# 1.85 pin. The script checks and says so rather than failing obscurely.
install-fgumi = "bash scripts/install-fgumi.sh"

# Combined
check = { depends-on = ["cargo-fmt-check", "cargo-clippy", "cargo-test", "py-fmt-check", "py-lint", "py-type", "py-test"] }

# Docker
#
# Both tasks route through the CLI rather than a shell script. The two scripts
# that used to live in docker/ passed only 7 of the Dockerfile's 13 defaultless
# ARGs, and BuildKit turns a missing `--build-arg` into a set-but-EMPTY variable
# rather than an error -- so they silently built images with no MINIBWA_SHA
# label and empty HOLODECK_REF / FGUMI_REF / TACHYON_VERSION pins. The CLI path
# is the one `tests/test_compat_arm.py` audits for exactly that hole.
#
# Multi-arch build + push to ECR. Usage:
#   pixi run build-docker <fg-labs-sha>
# Add --image-name <ecr-uri>; --push implies the full fleet platform matrix.
build-docker = "python -m bwa_mem3_bench.cli build --push -f"
# Native-arch build loaded into the local docker daemon, for smoke tests. Usage:
#   pixi run build-docker-native <fg-labs-sha>
build-docker-native = "python -m bwa_mem3_bench.cli build --load -f"

# Create the buildx builder with an explicit BuildKit GC ceiling. Without the
# --config, BuildKit's default GC threshold scales with the Docker VM disk
# (provisioned at the full host disk size), so the cache grew to ~95 GB before
# anything was collected. Re-run after `docker buildx rm`.
#
# NOTE `--use` switches the machine's GLOBAL default buildx builder, so running
# this task also changes which builder unrelated projects on this host build
# with. That is deliberate -- a builder you have to remember to select is one
# whose GC ceiling silently does not apply -- but it is a side effect beyond this
# repo. Drop `--use` and set BUILDX_BUILDER=bwa-mem3-bench-builder per-shell if
# you would rather keep the global default untouched.
#
# The builder NAME is repeated in `docker-prune` below; pixi tasks are plain
# strings with no variable interpolation, so the two are kept in sync by
# `tests/test_build_platforms.py` rather than by construction.
docker-builder-create = """
docker buildx create --name bwa-mem3-bench-builder --driver docker-container \
    --config docker/buildkitd.toml --use
"""
# Drop all of the project builder's cache, including `type=exec.cachemount`
# records -- a plain prune leaves those behind and they grow without bound.
#
# `docker buildx prune --builder <name>`, NOT `docker builder prune`. Each
# buildx builder runs its own buildkitd with its own cache: `docker builder
# prune` targets the daemon's built-in builder, so it would report success while
# leaving the `docker-container` builder's cache -- the one that reached ~95 GB
# and the whole reason buildkitd.toml exists -- completely untouched. Confirmed
# by `docker buildx du --builder <name>` reporting a different total from the
# default builder's.
#
# Errors rather than no-ops if the builder does not exist, which is the useful
# behaviour: it means the GC-bounded builder was never created and this repo's
# cache is unbounded.
docker-prune = "docker buildx prune --builder bwa-mem3-bench-builder --all --force"

# CDK (run via `python app.py` — no Node CDK CLI needed for synth)
# cdk-diff and cdk-deploy require `npm install -g aws-cdk` separately.
cdk-synth = { cmd = "python app.py", cwd = "cdk" }

# Render the Snakemake AWS Batch profile from its template. Reads
# cdk/outputs.json (or env vars) and writes workflow/profiles/aws-batch/config.yaml
# (gitignored). Run before any `snakemake --profile workflow/profiles/aws-batch`.
render-profile = "python -m bwa_mem3_bench.cli render-profile"

# Live-watch the active coordinator job. Pass --job-id to watch a specific one.
watch = "python -m bwa_mem3_bench.cli watch"
