name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: prefix-dev/setup-pixi@14c8aabd75893f83f4ab30c03e7cf853c8208961 # v0.8.10
        with:
          # Must match (or be ahead of) the pixi version that authored pixi.lock
          # locally, since pixi rejects locks written by newer formats.
          pixi-version: v0.66.0
          environments: default
          cache: true
      # Catches what the Python tests structurally cannot: workflow schema errors
      # and shell bugs inside `run:` bodies. It found `options: ["", lto-build]`
      # in build-image.yml -- a workflow GitHub rejects outright -- which every
      # unit test happily parsed, because PyYAML accepts an empty string where
      # GitHub's schema does not.
      - name: workflow lint
        run: pixi run workflow-lint
      - name: rust fmt
        run: pixi run cargo-fmt-check
      - name: rust clippy
        run: pixi run cargo-clippy
      - name: rust tests
        run: pixi run cargo-test
      - name: python fmt
        run: pixi run py-fmt-check
      - name: python lint
        run: pixi run py-lint
      - name: python types
        run: pixi run py-type
      # Built here rather than declared as a dependency: `fgumi compare bams` is
      # feature-gated off in a default build, so it must come from the pinned git
      # ref. Without it tests/test_fgumi_non_primary.py skips, and the compat
      # arms' non-primary coverage would go unasserted — which is the state this
      # test exists to end.
      #
      # Cached on its own, NOT by the cargo cache above: `cargo install` builds
      # in a temporary target directory, so `target/` and `~/.cargo` cover only
      # the dependency sources and every run would otherwise pay a full release
      # build of the fgumi workspace. `cargo install` no-ops when the install
      # root already holds the requested rev, so restoring `.fgumi` skips it
      # outright.
      #
      # The key hashes the WHOLE pin file, not just FGUMI_REF -- `hashFiles` has
      # no way to read one variable out of it. So bumping any unrelated pin in
      # there (BWA_VERSION, HOLODECK_REF, ...) also discards this cache and pays
      # one full fgumi build. Accepted: those pins move rarely, and the
      # alternative is a second file holding a copy of the ref, which is the
      # drift this script was written to avoid.
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .fgumi
          key: fgumi-${{ runner.os }}-${{ hashFiles('docker/build-arg-defaults.env') }}
      - name: install fgumi (pinned)
        run: pixi run install-fgumi
      - name: python tests
        run: pixi run py-test
