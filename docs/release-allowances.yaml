# Release-to-release alignment-change allowances (Gate #2 sign-off).
#
# bwa-mem3's output is gated tightly against the last blessed release. Moving the
# golden forward to a SHA whose alignments differ is a deliberate act: it
# requires BOTH re-blessing (`bench bless-golden`) AND an entry here recording
# the intentional change. `bless-golden` refuses to bless a SHA that no entry
# authorizes (use `--force` only for the very first golden).
#
# This is distinct from docs/expected-divergences.yaml, which budgets drift vs
# upstream bwa-mem2 (Gate #1). Entries here budget drift vs our own prior release.
#
# Fields:
#   to_sha             fg-labs SHA being blessed as the new golden (full or prefix)
#   pr                 PR that intentionally changed alignment
#   date               when blessed
#   summary            what changed and why it's intentional
#   expected_drift_pct approximate concordance drift vs the previous golden
# v0.2.0 is the first blessed golden and is blessed with `--force` (no prior
# golden to move from, so no allowance is needed or possible).
allowances:
  - to_sha: 89bd589db9fcb56279912fa6b23e0831f4916a62
    pr: fg-labs/bwa-mem3-bench#12
    date: 2026-06-08
    summary: >-
      v0.2.1: no alignment change vs v0.2.0. Both produce byte-identical
      primary alignments (100% concordance vs bwa-mem2 v2.2.1) and identical
      supplementary counts on every benchmarked sample; the golden is moved
      forward only for release continuity, not for a deliberate output change.
    expected_drift_pct: 0.0
  - to_sha: bffae5a09267877fe514c458d4956b717bcefb8f
    pr: fg-labs/bwa-mem3#123
    date: 2026-06-08
    summary: >-
      v0.2.2: deterministic tie-break ordering (fg-labs/bwa-mem3#123) and a
      handful of additional supplementary alignments (default-on; source PR not
      yet pinned, tracked in fg-labs/bwa-mem3#127) move a small, bounded
      fraction of records vs the v0.2.1 golden — wes-5M
      99.9996%, wgs-5M 99.9893%, panel-twist-5M 99.9414% primary concordance
      vs bwa-mem2 v2.2.1 (v0.2.1 was 100%), plus +5/+256/+199 supplementary
      records on those samples. Primary placement is preserved; the affected
      reads differ only in MAPQ/CIGAR/ordering detail. Intentional, accepted.
    expected_drift_pct: 0.06

  - to_sha: a02fcb446574d5b5d03abdbf73c9b129deead2d4
    pr: fg-labs/bwa-mem3#135
    date: 2026-06-21
    summary: >-
      v0.3.0: essentially no alignment change vs the v0.2.2 golden despite 32
      commits, mostly per-ISA Smith-Waterman tuning (#149/#160/#161/#162/#166)
      plus the 8-bit banded-SW path (#140), Gotoh extension-gap derivation
      (#141), and SMEM int16->int32 widening (#142). Primary concordance vs the
      v0.2.2 golden is 100.00000% on wgs-5M / wes-5M / smoke-1M / meth on every
      arch; panel-twist-5M is 99.99997% — exactly 2 of 7,913,324 reads differ,
      CIGAR-only (same position, same MAPQ), identical on all six archs and with
      identical supplementary counts. The shipped v0.3.0 tag (c78c8fe) is a
      docs/version-only commit on top of this benchmarked binary. Intentional,
      accepted.
    expected_drift_pct: 0.00003

  - to_sha: 2681143bb7ab665488cdcd5d46380cc928f5bd05
    pr: fg-labs/bwa-mem3-bench#19
    date: 2026-06-27
    summary: >-
      v0.4.0: a deliberate methylation-alignment change plus a small non-meth
      shift vs the v0.3.0 golden (a02fcb44).
      Meth — the fg-labs `--meth` path was cut over to the D3 native bisulfite
      contract (fg-labs/bwa-mem3-bench#19), so EM-seq alignments diverge
      substantially from the v0.3.0 bwameth-style golden: meth-twist-emseq-5M
      93.90% / smoke-meth 93.77% primary concordance vs the v0.3.0 golden
      (~6.1% drift; pos 4.0%, mapq 1.0%, plus mapped-only deltas). This is the
      intended new contract, and truth-based holodeck eval confirms quality is
      preserved: native-bisulfite placement is ~95% correct (sim-meth-place
      94.3% / sim-meth-vars 95.1%, within ~0.4pp of bwameth's 94.7%/95.4%)
      while additionally recovering methylation that bwameth/minibwa do not
      (per-CpG Pearson r 0.945-0.980 across the meth sim datasets).
      Non-meth — a tiny, bounded fraction of reads shifts vs the v0.3.0 golden,
      identical across all six archs: wgs-5M 99.9986% (142 of 9.98M; pos 77,
      mapq 61, cigar 3), smoke-1M 99.976% (15 of 63k), panel-twist-5M 99.9725%
      (2173 of 7.91M; pos 1332, mapq 763). All non-meth samples stay within the
      Gate #1 upstream-drift budget, and truth-based placement is byte-identical
      to bwa-mem2 v2.2.1 (sim-wgs-place / sim-wgs-vars fg-labs == baseline), so
      primary placement quality is unchanged. Performance improved or held flat
      everywhere (1.1-1.9x compute speedup vs upstream; no wall-time
      regressions). Intentional, accepted.
    expected_drift_pct: 6.1
