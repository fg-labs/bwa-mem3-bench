# Release-to-release alignment-change allowances (Gate #2 sign-off).
#
# bwa-mem3's output is gated tightly against the last blessed release. Moving the
# golden forward to a SHA whose alignments differ is a deliberate act: it
# requires BOTH re-blessing (`bench bless-golden`) AND an entry here recording
# the intentional change. `bless-golden` refuses to bless a SHA that no entry
# authorizes (use `--force` only for the very first golden).
#
# This is distinct from docs/expected-divergences.yaml, which budgets drift vs
# upstream bwa-mem2 (Gate #1). Entries here budget drift vs our own prior release.
#
# Fields:
#   to_sha             fg-labs SHA being blessed as the new golden (full or prefix)
#   pr                 PR that intentionally changed alignment
#   date               when blessed
#   summary            what changed and why it's intentional
#   expected_drift_pct approximate concordance drift vs the previous golden
# v0.2.0 is the first blessed golden and is blessed with `--force` (no prior
# golden to move from, so no allowance is needed or possible).
allowances:
  - to_sha: 89bd589db9fcb56279912fa6b23e0831f4916a62
    pr: fg-labs/bwa-mem3-bench#12
    date: 2026-06-08
    summary: >-
      v0.2.1: no alignment change vs v0.2.0. Both produce byte-identical
      primary alignments (100% concordance vs bwa-mem2 v2.2.1) and identical
      supplementary counts on every benchmarked sample; the golden is moved
      forward only for release continuity, not for a deliberate output change.
    expected_drift_pct: 0.0
  - to_sha: bffae5a09267877fe514c458d4956b717bcefb8f
    pr: fg-labs/bwa-mem3#123
    date: 2026-06-08
    summary: >-
      v0.2.2: deterministic tie-break ordering (fg-labs/bwa-mem3#123) and a
      handful of additional supplementary alignments (fg-labs/bwa-mem3#101)
      move a small, bounded fraction of records vs the v0.2.1 golden — wes-5M
      99.9996%, wgs-5M 99.9893%, panel-twist-5M 99.9414% primary concordance
      vs bwa-mem2 v2.2.1 (v0.2.1 was 100%), plus +5/+256/+199 supplementary
      records on those samples. Primary placement is preserved; the affected
      reads differ only in MAPQ/CIGAR/ordering detail. Intentional, accepted.
    expected_drift_pct: 0.06
