# Release-to-release alignment-change allowances (Gate #2 sign-off).
#
# bwa-mem3's output is gated tightly against the last blessed release. Moving the
# golden forward to a SHA whose alignments differ is a deliberate act: it
# requires BOTH re-blessing (`bench bless-golden`) AND an entry here recording
# the intentional change. `bless-golden` refuses to bless a SHA that no entry
# authorizes (use `--force` only for the very first golden).
#
# This is distinct from docs/expected-divergences.yaml, which budgets drift vs
# upstream bwa-mem2 (Gate #1). Entries here budget drift vs our own prior release.
#
# Fields:
#   to_sha             fg-labs SHA being blessed as the new golden (full or prefix)
#   pr                 PR that intentionally changed alignment
#   date               when blessed
#   summary            what changed and why it's intentional
#   expected_drift_pct approximate concordance drift vs the previous golden
#   aliases            SHAs sharing this entry's golden (see `ReleaseAllowance.aliases`)
#
# Terminology: an identity claim in a `summary` below ("byte-identical",
# "record-stream-identical", "identical output") always means the ALIGNMENT
# RECORD STREAM is identical -- never the BAM file's bytes. Two runs of the same
# SHA routinely differ as files: the workflow compresses with `samtools view -@4`,
# whose block boundaries vary run to run, and the `@PG` header embeds the run path
# and the SHA-stamped version string. Never use `md5` on the BAM.
#
# Establish a record-stream-identity claim with `fgumi compare bams`, which is
# the only instrument here that can support one: it compares all eleven core SAM
# fields (QNAME, FLAG unmasked, RNAME, POS, MAPQ, CIGAR, RNEXT, PNEXT, TLEN, SEQ,
# QUAL) plus every aux tag, and enforces @HD(SO/GO)/@SQ/@RG compatibility, while
# ignoring exactly the things the paragraph above disclaims (on-disk tag order
# and integer width, @PG/@CO). `compare-bams` CANNOT support such a claim and
# must not be cited for one: it compares placement (ref/pos/CIGAR/MAPQ), the
# whole FLAG, and aux tags on primary records, plus a separate non-primary axis
# -- it never reads QNAME, SEQ, QUAL, TLEN, RNEXT/PNEXT, or the header. Its
# graded percentage is the right tool for BUDGETED drift (Gate #1/#2), not for
# identity. (Through the v0.8.0 golden it compared FLAG masked to
# 0x10|0x20|0x40|0x80 and never compared non-primary content at all, so
# concordance figures from before that widening are not strictly comparable with
# ones after it.)
# v0.2.0 is the first blessed golden and is blessed with `--force` (no prior
# golden to move from, so no allowance is needed or possible).
allowances:
  - to_sha: 89bd589db9fcb56279912fa6b23e0831f4916a62
    pr: fg-labs/bwa-mem3-bench#12
    date: 2026-06-08
