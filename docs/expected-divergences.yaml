# Expected divergences between fg-labs/bwa-mem3 and upstream/bwa-mem2.
#
# ERRATA (2026-09-03): any `panel-twist-5M` drift figure recorded before
# 2026-09-03 was measured on a MISLABELED sample — `SRR34589119` is Felis catus
# (a cat), not a human Twist panel (0.79% on-target to hg38). The FG-PRIMARY-DRIFT
# budget was calibrated against that cat drift; real human panel data may drift
# differently and the budget may need recalibration once regenerated. The sample
# was replaced with human `SRR37186773` (MCF10A).
#
# Each entry documents an intentional fg-labs behavior change that produces a
# classifiable drift in aligned-BAM output vs bwa-mem2 v2.2.1. The regression
# gate (`bench regression`) sums the `expected_drift_pct` of the entries scoped
# to each sample and fails a cell only when the OBSERVED concordance drift
# (100 - concordance_pct) exceeds that declared budget — so known, intentional
# divergence passes while genuine, unexplained regressions still fail.
#
# Fields:
#   id                 stable identifier
#   pr                 originating fg-labs/bwa-mem3 PR (or representative one)
#   date               when the divergence was characterized
#   summary            what the divergence is and why it exists
#   affected           coarse class: primary_alignment | meth_alignment |
#                      supplementary_alignment | secondary_alignment
#   expected_drift_pct per-cell drift budget contributed by this entry (percent)
#   samples            samples this budget applies to; omit/empty = all samples
#
# Budgets are set just above the empirically observed drift at bwa-mem3
# `bffae5a` (full bench, all archs x all samples x 5 reps): non-meth primary
# drift peaks at panel-twist-5M 0.0586%; meth at 1.1227%. Tighten per-sample as
# the numbers stabilize across releases. The hic-1M / sbx-1M sample classes were
# added later (bench #14) and first characterized at `a02fcb4` (v0.3.0): primary
# drift hic-1M 0.0032%, sbx-1M 0.0004% — both well inside the 0.10% primary tier.
divergences:
  - id: FG-PRIMARY-DRIFT
    pr: fg-labs/bwa-mem3#123
    date: 2026-06-07
    summary: >-
      Per-architecture SIMD score2/MAPQ convergence (#21, #26, #28-#31) and
      deterministic tie-break ordering (#123) shift MAPQ, CIGAR, or position on a
      small fraction of primary alignments relative to bwa-mem2 v2.2.1. Where
      each read maps is preserved; the affected reads differ in placement
      detail, and the set varies by SIMD architecture. Applies equally to the
      Hi-C (hic-1M, -5SP) and single-end SBX (sbx-1M) read classes — same
      mechanism, drift well under the budget.
    affected: primary_alignment
    expected_drift_pct: 0.10
    samples: [wgs-5M, wes-5M, panel-twist-5M, smoke-1M, hic-1M, sbx-1M]

  - id: FG-METH-DIVERGENCE
    pr: fg-labs/bwa-mem3#90
    date: 2026-08-05
    summary: >-
      Bisulfite (--meth) mode against the bwameth.py baseline diverges in
      placement (C->T/G->A conversion handling), giving a larger but still
      bounded concordance drift on methylation workloads. The two aligners'
      bisulfite tags are not comparable at all and are excluded rather than
      budgeted: bwameth computes NM/MD — and the NM embedded in XA/SA — against
      the converted reference, and the Bismark-compatible XM/XG/XR set has no
      bwameth counterpart (bwameth writes YD/YC/RG instead). See
      `compare_options` in config/samples.yaml.

      Budget re-derived 2026-08-05 from 1.50%, which had been stale since the
      v0.4.0 native-bisulfite cutover — observed drift was already 2.88% at
      v0.7.0 and 3.02% at v0.8.0, i.e. the gate had been failing on both meth
      cells for several releases. That excess was reviewed and accepted at the
      time rather than budgeted (docs/release-allowances.yaml, the v0.6.0 and
      v0.7.0 entries); this makes the registry say what those entries already
      concluded.

      Measured at the v0.8.0 golden (4acb0956) against bwameth 0.2.7, on the
      COMPLETE meth population for this gate — meth samples run on m7i only and
      all five reps are bit-identical, so two cells is the whole matrix:
      meth-twist-emseq-5M 3.3764%, smoke-meth 3.2932%. Of that, ~0.3 pp is newly
      VISIBLE rather than new: widening compare-bams to the whole FLAG exposed
      the 0x200 QC-fail bit, which bwa-mem3 sets from a hand-ported copy of
      bwameth.py's own chimera heuristic (src/meth_bam.cpp:488). The two
      implementations disagree on which reads to flag, and that path sets 0x200
      and clears 0x2 together, so the disagreement lands on both bits at once —
      69% of differing records XOR to exactly 0x202. 4.00% sits just above the
      3.38% peak with headroom comparable to the primary tier's.
    affected: meth_alignment
    expected_drift_pct: 4.00
    samples: [meth-twist-emseq-5M, smoke-meth]

  - id: FG-SUPP-ADDITIONS
    # Source PR not yet pinned: these additions are default-on and are NOT the
    # opt-in --supp-rep-hard-cap path that #101 enables (#101 only lowers MAPQ,
    # never adds records). Pinning the originating divergence is tracked in
    # fg-labs/bwa-mem3#127; replace TBD with the real PR once it is bisected.
    pr: TBD
    date: 2026-06-07
    summary: >-
      bwa-mem3 once emitted a small number of additional supplementary
      (split/chimeric) alignments vs bwa-mem2 v2.2.1 on the default build. The
      counts have since converged: measured across every non-meth vs_baseline
      cell of the v0.8.0 golden (4acb0956), query and baseline supplementary
      totals are EQUAL on all 330, with supp_unmatched 0 — the "wes-5M: 5123 vs
      5118" this entry used to cite is now 5118 vs 5118. Kept at 0.0 rather than
      retired: it is the registry's record that supplementary counts are watched
      and are currently clean, and retiring it would make a future divergence
      look unanticipated.

      Supplementary CONTENT is now compared too, not just counted (matched pairs
      run through the same classifier as primaries, with a per-class breakdown in
      supp_by_class). That axis is reported separately and deliberately does not
      enter concordance_pct, so it does not contribute to this budget either.

      First corpus-wide measurement, same golden, identical on every arch:
      vs_baseline and vs_x86 are ZERO on every non-meth cell — bwa-mem3 and
      bwa-mem2 agree on the full content of every matched supplementary, which
      is a stronger claim than this project could previously make at all.
      vs_golden, where two bwa-mem3 releases legitimately differ, carries a
      small bounded population: panel-twist-5M 1022, wgs-5M 470, hic-1M 35,
      sbx-1M 12, smoke-1M 10, wes-5M 1. The secondary axis fires only on meth
      (meth-twist-emseq-5M 2, smoke-meth 0 content diffs).

      Those vs_golden counts are release-pair-specific — they describe v0.7.0 ->
      v0.8.0 — so they are recorded as the observed baseline rather than promoted
      to a threshold. A cross-release budget needs a second release pair to
      establish a rate; until then a jump against these numbers is the signal.

      NOTE: this entry has an empty `samples`, so `allowed_drift_pct` adds it to
      EVERY sample's budget. It must stay 0.0 unless a divergence genuinely
      applies corpus-wide — a non-zero value here silently grants budget to
      samples that are meant to have none, including any deliberately gated at
      0.0. `wgs-5M-alt` is exactly that case: it carries no entry of its own so
      that ANY ALT-aware drift fails Gate #1. fg-labs/bwa-mem3#363 (proper-pair
      `0x2`) and #365 (unrounded `pa:f:`) are both fixed on main, so the arm is
      expected to be clean and the zero budget locks those fixes in.
      `test_alt_arm_has_no_drift_budget` asserts the computed total rather than
      the absence of an entry, so editing this value breaks that test rather
      than the lock-in.
    affected: supplementary_alignment
    expected_drift_pct: 0.0
    samples: []
